additionalProperties:
    formFields:
        - default: 5583
          edit: true
          envKey: PANEL_APP_PORT_HTTP
          labelEn: Port
          labelZh: 端口
          required: true
          rule: paramPort
          type: number
        - default: ./data/upload
          edit: true
          envKey: PANEL_UPLOAD_LOCATION
          labelEn: Path to folder for uploading
          labelZh: 上传用文件夹路径
          required: true
          type: text
        - default: ./data/library
          edit: true
          envKey: PANEL_LIBRARY_LOCATION
          labelEn: Path to folder for library
          labelZh: 相册文件夹路径
          required: false
          type: text
        - default: ./data/thumbs
          edit: true
          envKey: PANEL_THUMB_LOCATION
          labelEn: Path to folder for thumbs
          labelZh: 缩略图文件夹路径
          required: false
          type: text
        - default: ./data/encoded-video
          edit: true
          envKey: PANEL_ENCODED_VIDEO_LOCATION
          labelEn: Path to folder for encoded video
          labelZh: 视频转码文件夹路径
          required: false
          type: text
        - default: ./data/profile
          edit: true
          envKey: PANEL_PROFILE_LOCATION
          labelEn: Path to folder for profile
          labelZh: 用户文件夹路径
          required: false
          type: text
        - default: ./data/backups
          edit: true
          envKey: PANEL_BACKUP_LOCATION
          labelEn: Path to folder for backups
          labelZh: 备份文件夹路径
          required: false
          type: text
        - default: ./data/cache
          edit: true
          envKey: PANEL_CACHE_PATH
          labelEn: Cache folder path
          labelZh: 缓存文件夹路径
          required: true
          type: text
        - default: ./data/dbdata
          edit: true
          envKey: PANEL_DATA_PATH
          labelEn: Database folder path
          labelZh: 数据库文件夹路径;内置时使用
          required: true
          type: text
        - default: postgres
          edit: true
          envKey: PANEL_DB_HOST
          labelEn: Database host
          labelZh: 数据库Host;外置时使用
          required: true
          type: text
        - default: 5432
          edit: true
          envKey: PANEL_DB_PORT
          labelEn: Database port
          labelZh: 数据库端口
          required: true
          rule: paramPort
          type: number
        - default: immich
          edit: true
          envKey: PANEL_DB_NAME
          labelEn: Database
          labelZh: 数据库名
          required: true
          rule: paramCommon
          type: text
        - default: immich
          edit: true
          envKey: PANEL_DB_USER
          labelEn: Postgres User
          labelZh: Postgres 数据库用户
          required: true
          rule: paramCommon
          type: text
        - default: immich_P@ssw0rd
          edit: true
          envKey: PANEL_DB_PASSWORD
          labelEn: Postgres Password
          labelZh: Postgres 数据库用户密码
          random: true
          required: true
          rule: paramComplexity
          type: password
        - default: redis_pass123
          edit: true
          envKey: PANEL_REDIS_PASSWORD
          labelEn: redis Password
          labelZh: redis 密码
          random: true
          required: true
          rule: paramComplexity
          type: password